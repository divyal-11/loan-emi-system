name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Lint, Typecheck & Integration Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run TypeScript Typecheck
        working-directory: ./server
        run: npm run typecheck

      - name: Run ESLint
        working-directory: ./server
        run: npm run lint

      - name: Run Jest Unit & Integration Tests
        working-directory: ./server
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://localhost:27017/loan-emi-system-test
          JWT_SECRET: ci-pipeline-secret-key-minimum-32-characters-long
          JWT_EXPIRES_IN: 7d
        run: npm test

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Next.js Production Build
        working-directory: ./client
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
        run: npm run build
